<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sporefall</title>
    <style>
    :root {
      color-scheme: light;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f7f0;
      color: #233826;
      font-family: system-ui, sans-serif;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    button {
      font: inherit;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid #2f6f4f;
      background: #e4f2e6;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .hint {
      color: #5b7463;
      font-size: 0.85rem;
      margin: 0.15rem 0 0.6rem;
    }
    #spore-counter {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0.6rem 0 0;
    }
    #production-rate {
      color: #5b7463;
      margin: 0.15rem 0 1.2rem;
    }
    h2 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5b7463;
      margin: 1.6rem 0 0.8rem;
    }
    .upgrade {
      max-width: 24rem;
      margin: 0 auto 0.6rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d8e6d4;
      border-radius: 10px;
      background: #ffffff;
    }
    .upgrade button {
      width: 100%;
    }
    .upgrade .hint {
      margin: 0.35rem 0 0;
      text-align: left;
    }
    .spore-float {
      position: fixed;
      color: #2f6f4f;
      font-weight: 600;
      pointer-events: none;
      animation: spore-rise 0.8s ease-out forwards;
    }
    @keyframes spore-rise {
      from {
        opacity: 1;
        transform: translate(-50%, -100%);
      }
      to {
        opacity: 0;
        transform: translate(-50%, -180%);
      }
    }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
